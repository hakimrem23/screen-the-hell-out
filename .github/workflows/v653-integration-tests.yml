name: V6.5.3 read-only integration tests
on:
  push:
    branches: ['feature/v653-streamlit-integration-v1']
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'v653/**'
      - 'tests/**'
      - '.github/workflows/v653-integration-tests.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'v653/**'
      - 'tests/**'
      - '.github/workflows/v653-integration-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline regressions and synthetic Streamlit tests
        env:
          PYTHONWARNINGS: ignore::DeprecationWarning
        run: python -B -m tests.run --output test-results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: synthetic-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 90
