[v653]
mode = "synthetic_preview"

# Owner approval + authenticated private hosting required before enabling:
# mode = "private"
# owner_approved_private_access = true
# audience = "authenticated_private"
# approval_reference = "OWNER_REVIEW_REFERENCE"
# allowed_emails = ["approved-reviewer@example.test"]
# github_token = "SET_ONLY_IN_SERVER_SECRET_STORE"
# approved_source_sha = "OWNER_REVIEWED_40_HEX_EXECUTABLE_COMMIT"
# approved_protocol_sha256 = "OWNER_REVIEWED_64_HEX_PROTOCOL_DIGEST"

# Additional required private-session controls (owner server configuration only):
# oidc_issuer = "https://accounts.google.com"
# oidc_client_id = "MUST_MATCH_AUTH_CLIENT_ID"
# auth_not_before_utc = "OWNER_ROTATION_CUTOFF_UTC"
# credential_generation = "OWNER_CREDENTIAL_VERSION"
# session_generation = "OWNER_SESSION_VERSION"
# max_session_age_seconds = 3600
# On rotation update cutoff/generations, rotate the auth cookie secret, revoke
# the old token and restart every replica; never rely only on a cache timeout.

# Configure your hosting platform's Streamlit [auth] OIDC settings separately.
